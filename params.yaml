general:
  output_folder: "output"
  seed: 42

display:
  min_brightness: 0.2 # cd/m^2
  max_brightness: 250.0 # cd/m^2
  distance_cm: 50
  ppi: 141
  gamma: 2.2

stimulus:
  canvas_height: 1080
  canvas_width: 1920
  outer_box_size: 128
  inner_box_size: 64
  margin: 60 # gap between the two fields
  diff: 32 # offset of inner box inside outer box
  center_y: 350
  sigma: 25 # std in pixels, applies after render

luminance:
  background: 0.2
  outer: 19.0
  inner: 2.3

visual:
  d_prime: 5.0 # критерий обнаружения;

noise:
  sigma: 25 # std in pixels, applies after render

train:
  simkin_data_dir: "output/dataset_8_1"
  simkin_csv_path: "output/labels_8_1.csv"
  train_size: 0.8
  num_workers: 12
  batch_size_class: 32
  batch_size_penalty: 16
  lambda_simkin: 0.4
  lr: 1e-3
  model_name: "ResNetSIM_frozen_noisy"
  weight_decay: 1e-4
  epochs: 10
  freeze_frontend: True
  frontend_noise: 0.5
  pretrain_epochs: 30
  pretrain_lr: 1e-3
