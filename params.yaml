general:
  output_folder: "output_solo_exp"
  seed: 42

display:
  min_brightness: 0.2 # cd/m^2
  max_brightness: 250.0 # cd/m^2
  distance_cm: 50
  ppi: 141
  gamma: 2.2

stimulus:
  canvas_height: 1080
  canvas_width: 1920
  outer_box_size: 128
  inner_box_size: 64
  margin: 60 # gap between the two fields
  diff: 32 # offset of inner box inside outer box
  center_y: 350
  sigma: 25 # std in pixels, applies after render

luminance:
  background: 0.2
  outer: 19.0
  inner: 2.3

visual:
  d_prime: 5.0 # критерий обнаружения; поднят с 2.5 под человеческую эффективность

noise:
  sigma: 25 # std in pixels, applies after render

train_siamese:
  simkin_data_dir: "output/dataset_8_1"
  simkin_csv_path: "output/labels_8_1.csv"
  train_size: 0.8
  num_workers: 12
  batch_size_class: 32
  batch_size_penalty: 16
  lambda_simkin: 0.4
  lr: 1e-3
  model_name: "ResNetSIM_shared"
  weight_decay: 1e-4
  epochs: 10
  freeze_frontend: True
  frontend_noise: 0.5
  pretrain_epochs: 30
  pretrain_lr: 1e-3
  delta: 0.01

train_tile:
  tile_dir: "output_solo_exp/dataset_tile"
  tile_csv: "output_solo_exp/labels_tile.csv"
  no_pretrain: false
  pretrain_epochs: 30
  pretrain_lr: 0.001
  soft_delta: 0.01
  noise_sigma: 0.5
  epochs: 10
  lr: 0.001
  batch_size: 512 # ~10ГБ оперативки
  num_workers: 8
  eps_255: 2 # eps = eps_255 / 255
  pgd_steps: 20
  eot_k: 20
  robust_batches: null # null -> весь тест; int -> первые N батчей
  seed: 42
  tap: "conv1" # точка ветвления: conv1|stem|l1.0|l1.1|l1|l2|l3|l4 (мельче = ближе к V1)
