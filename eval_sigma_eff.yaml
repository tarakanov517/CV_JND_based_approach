# Simkin (tile) vs VOne на оси σ_eff. Обе семьи — Poisson, дообучены под свой шум (пункт B).
# Положи в configs/eval_sigma_eff.yaml. Пути ckpt поправь под реальные имена.
dataset: imagewoof
data_root: data
cache_dir: cache
out_dir: output/sigma_eff

n: 1000
seed_eval: 0
batch_size: 64
num_workers: 4
amp: true

eps_255: [2, 4]
steps: 20
eot_k: 10
vote_reps: 8
sigma_batches: 3

severities: [1, 2, 3, 4, 5]

