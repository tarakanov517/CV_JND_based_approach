# Simkin Poisson (опция A) — свип по noise_scale, валидация устойчивости.
# Положи в configs/eval_sigma_eff.yaml. Логика та же, что была у sigma-свипа,
# только ручка теперь noise_scale (меньше scale → больше шума), level фиксирован.
# additive (σ=3.0) и baseline повторно НЕ гоняем — их числа уже есть.
dataset: imagenette # imagenette | imagewoof | stl10
data_root: data
cache_dir: cache
out_dir: output/sigma_eff

n: 1000 # подвыборка теста (на ней clean/robust/retention)
seed_eval: 0
batch_size: 64
num_workers: 4
amp: true

eps_255: [2, 4] # Linf-бюджеты для EOT-PGD
steps: 20 # шагов PGD
eot_k: 10 # реализаций шума на градиент
vote_reps: 8 # голосование на eval
sigma_batches: 3 # по скольки чистым батчам усреднять σ_eff (опционально, для общей оси)

severities: [1, 2, 3, 4, 5] # natural-коррапшены усредняются по severity

# По модели на каждое значение noise_scale (как раньше по sigma).
# noise_level фиксирован (дефолт VOne 0.07). Simkin-ckpt хранит только state_dict,
# поэтому noise_type/scale/level задаём тут.
models:
  - name: pois_sc0.70
    ckpt: /kaggle/input/models/mrtyom/resnetmode/pytorch/default/20/imagenette_LateSimkin_l4_poisSc0.7_lam0.2_s42.pt
    tap: l4
    noise_tap: conv1
    dual_bn: true
    noise_type: neuronal
    noise_scale: 0.70 # слабый шум
    noise_level: 0.07

  - name: pois_sc0.35
    ckpt: /kaggle/input/models/mrtyom/resnetmode/pytorch/default/20/imagenette_LateSimkin_l4_poisSc0.35_lam0.2_s42.pt
    tap: l4
    noise_tap: conv1
    dual_bn: true
    noise_type: neuronal
    noise_scale: 0.35 # дефолт VOne
    noise_level: 0.07

  - name: pois_sc0.20
    ckpt: /kaggle/input/models/mrtyom/resnetmode/pytorch/default/20/imagenette_LateSimkin_l4_poisSc0.2_lam0.2_s42.pt
    tap: l4
    noise_tap: conv1
    dual_bn: true
    noise_type: neuronal
    noise_scale: 0.20
    noise_level: 0.07

  - name: pois_sc0.10
    ckpt: /kaggle/input/models/mrtyom/resnetmode/pytorch/default/20/imagenette_LateSimkin_l4_poisSc0.1_lam0.2_s42.pt
    tap: l4
    noise_tap: conv1
    dual_bn: true
    noise_type: neuronal
    noise_scale: 0.10 # сильный шум
    noise_level: 0.07
