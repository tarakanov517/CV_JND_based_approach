# Задача 3: baseline vs SimkinNet vs VOne на нативных 224 (Imagenette).
# Чекпойнты -- выход src/train_late_simkin.py preset=exp224 и src/train_vone.py.
dataset: imagenette          # imagenette | imagewoof
data_root: data
cache_dir: cache
out_dir: output/bench_imagenette
seed_eval: 0                 # сид случайной подвыборки теста (одинаковый для всех моделей)
num_workers: 4
amp: true                    # fp16 форвард в атаках (лосс масштабируется, см. eot_pgd_acc)

clean:
  vote_reps: 10              # доп. колонка: голосование по 10 реализациям шума

whitebox:
  eps_255: [1, 2, 4, 8]
  steps: 20
  eot_k: 20
  n: 1000                    # null -> весь тест (3925); k=20 на 224 дорого
  batch_size: 64

eot_sweep:
  ks: [10, 20, 40]
  eps_255: 2
  n: 500

blackbox:
  eps_255: [2, 4]
  n: 500
  batch_size: 64
  square_queries: 2000       # 0 -> пропустить Square
  transfer_steps: 20
  surrogate: baseline        # имя модели-суррогата из списка ниже

corruptions:
  names: all                 # all = natural+digital+noise (9 шт.) или список
  severities: [1, 2, 3, 4, 5]
  n: null                    # весь тест
  reps: 1
  n_jobs: -1

models:
  - name: baseline
    arch: tile
    ckpt: models/imagenette_baseline_s42.pt
    noise_sigma: 0.0
    tap: l4
    noise_tap: conv1
    dual_bn: true
  - name: simkin
    arch: tile
    ckpt: models/imagenette_LateSimkin_l4_ns0.5_lam0.2_s42.pt   # <- σ* из noise-ablation
    noise_sigma: 0.5
    tap: l4
    noise_tap: conv1
    dual_bn: true
  - name: simkin_noise_only             # контроль «только шум» (λ=0), тот же σ
    enabled: false
    arch: tile
    ckpt: models/imagenette_LateSimkin_l4_ns0.5_lam0_s42.pt
    noise_sigma: 0.5
    tap: l4
    noise_tap: conv1
    dual_bn: true
  - name: vone
    arch: vone
    ckpt: models/imagenette_vone_s42.pt
    noise_on: true
